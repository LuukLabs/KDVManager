apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: observability-stack
    app.kubernetes.io/component: telemetry-collector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: observability-stack
        app.kubernetes.io/component: telemetry-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.155.0
          args: ["--config=/etc/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317 # OTLP gRPC
              name: otlp-grpc
            - containerPort: 4318 # OTLP HTTP
              name: otlp-http
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Uncomment together with the otlp/backend exporter to start
            # shipping. Create the secret first, e.g.:
            #   kubectl create secret generic otlp-backend -n observability \
            #     --from-literal=endpoint=otlp-gateway-prod-eu-west-2.grafana.net:443 \
            #     --from-literal=auth="Basic <base64 instanceID:token>"
            # - name: OTLP_BACKEND_ENDPOINT
            #   valueFrom:
            #     secretKeyRef:
            #       name: otlp-backend
            #       key: endpoint
            # - name: OTLP_BACKEND_AUTH
            #   valueFrom:
            #     secretKeyRef:
            #       name: otlp-backend
            #       key: auth
          resources:
            # kubeletstats and k8s_cluster moved off this pod, so the heavy
            # metric state is gone. memory_limiter is set to 300MiB, ~78% of the
            # limit, so the collector sheds load before the kernel intervenes.
            requests:
              cpu: 80m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
