# KDVManager on a single VM (replacement for the DOKS cluster).
#
# Only Caddy publishes ports. Everything else lives on private Docker networks.
# Secrets and image tags come from /opt/kdvmanager/.env (see .env.example).
#
#   internet ─▶ caddy:443 ─┬─▶ web:80          (app.kdvmanager.nl)
#                          └─▶ envoy:8080      (api.kdvmanager.nl, JWT check)
#                                 ├─▶ crm-api:8080
#                                 └─▶ scheduling-api:8080 ─┐
#                                     rabbitmq:5672  ◀─────┘ (internal only)
#   APIs ─▶ DigitalOcean managed Postgres over the private VPC network

name: kdvmanager

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-dotnet-env: &dotnet-env
  DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/dotnet_bundle_extract
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://0.0.0.0:8080
  # No collector on the VM; disable OTLP export instead of letting it retry.
  OTEL_SDK_DISABLED: "true"

services:
  caddy:
    <<: *hardening
    image: caddy:2.10.2-alpine
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      TLS_MODE: ${TLS_MODE:-auto}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    networks: [edge]
    depends_on: [web, envoy]
    mem_limit: 128m

  web:
    <<: *hardening
    image: ghcr.io/luuklabs/kdvmanager/web:${WEB_TAG}
    # nginx master starts as root and drops to the nginx user.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks: [edge]
    mem_limit: 64m

  envoy:
    <<: *hardening
    image: envoyproxy/envoy:v1.34-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    user: "101:101"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    tmpfs:
      - /tmp
    networks: [edge, app]
    depends_on:
      crm-api: { condition: service_healthy }
      scheduling-api: { condition: service_healthy }
    mem_limit: 128m

  crm-migrator:
    <<: *hardening
    restart: "no"
    image: ghcr.io/luuklabs/kdvmanager/crm.migrator:${CRM_TAG}
    user: "1001:1001"
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/dotnet_bundle_extract
      ConnectionStrings__KDVManagerCRMConnectionString: "Server=${POSTGRES_HOST}; port=${POSTGRES_PORT}; database=${CRM_DATABASE}; User ID=${POSTGRES_USER}; password=${POSTGRES_PASSWORD}; sslmode=require; pooling=true; Maximum Pool Size=2"
    tmpfs: [/tmp]
    networks: [app]

  crm-api:
    <<: *hardening
    image: ghcr.io/luuklabs/kdvmanager/crm.api:${CRM_TAG}
    user: "1001:1001"
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: crm-api
      ConnectionStrings__KDVManagerCRMConnectionString: "Server=${POSTGRES_HOST}; port=${POSTGRES_PORT}; database=${CRM_DATABASE}; User ID=${POSTGRES_USER}; password=${POSTGRES_PASSWORD}; sslmode=require; pooling=true; Maximum Pool Size=5; Minimum Pool Size=1; Connection Idle Lifetime=300; Connection Pruning Interval=10"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
    tmpfs: [/tmp]
    networks: [app, mq]
    depends_on:
      crm-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    mem_limit: 320m

  scheduling-migrator:
    <<: *hardening
    restart: "no"
    image: ghcr.io/luuklabs/kdvmanager/scheduling.migrator:${SCHEDULING_TAG}
    user: "1001:1001"
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/dotnet_bundle_extract
      ConnectionStrings__KDVManagerSchedulingConnectionString: "Server=${POSTGRES_HOST}; port=${POSTGRES_PORT}; database=${SCHEDULING_DATABASE}; User ID=${POSTGRES_USER}; password=${POSTGRES_PASSWORD}; sslmode=require; pooling=true; Maximum Pool Size=2"
    tmpfs: [/tmp]
    networks: [app]

  scheduling-api:
    <<: *hardening
    image: ghcr.io/luuklabs/kdvmanager/scheduling.api:${SCHEDULING_TAG}
    user: "1001:1001"
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: scheduling-api
      ConnectionStrings__KDVManagerSchedulingConnectionString: "Server=${POSTGRES_HOST}; port=${POSTGRES_PORT}; database=${SCHEDULING_DATABASE}; User ID=${POSTGRES_USER}; password=${POSTGRES_PASSWORD}; sslmode=require; pooling=true; Maximum Pool Size=5; Minimum Pool Size=1; Connection Idle Lifetime=300; Connection Pruning Interval=10"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
    tmpfs: [/tmp]
    networks: [app, mq]
    depends_on:
      scheduling-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    mem_limit: 320m

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4.1-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [mq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge: {}
  app: {}
  # No route to the outside world: RabbitMQ is only reachable by the APIs.
  mq:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  rabbitmq_data: {}
