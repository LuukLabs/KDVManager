# Redirect all plain-HTTP traffic to HTTPS. ACME challenge routes created by
# cert-manager use an exact path match, which takes precedence over this
# prefix match, so certificate renewals keep working.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: kdvmanager-prod
spec:
  parentRefs:
    - name: kdvmanager-gateway
      sectionName: http
  hostnames:
    - app.kdvmanager.nl
    - api.kdvmanager.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: kdvmanager-prod
spec:
  parentRefs:
    - name: kdvmanager-gateway
      sectionName: https-app
  hostnames:
    - app.kdvmanager.nl
  rules:
    - backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: kdvmanager-prod
spec:
  parentRefs:
    - name: kdvmanager-gateway
      sectionName: https-api
  hostnames:
    - api.kdvmanager.nl
  rules:
    - backendRefs:
        - name: envoy
          port: 80
