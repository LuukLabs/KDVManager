# Explicit Certificates (previously generated by cert-manager's ingress-shim
# from the Ingress objects). Names and secrets are unchanged, so the existing
# certificates are adopted rather than reissued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kdvmanager-nl-tls
  namespace: kdvmanager-prod
spec:
  secretName: kdvmanager-nl-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - app.kdvmanager.nl
    - api.kdvmanager.nl
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: signoz-tls-cert
  namespace: signoz
spec:
  secretName: signoz-tls-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - signoz.kdvmanager.nl
---
# Lets the Gateway in kdvmanager-prod use the SigNoz TLS secret.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-kdvmanager-gateway-tls
  namespace: signoz
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kdvmanager-prod
  to:
    - group: ""
      kind: Secret
      name: signoz-tls-cert
