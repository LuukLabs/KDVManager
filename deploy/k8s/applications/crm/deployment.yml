apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
spec:
  # Two replicas so an OOMKill, eviction or node blip no longer takes the whole
  # API down: with one replica the Service had no endpoints while the pod
  # restarted and Envoy answered every request with a 503.
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 
  selector:
    matchLabels:
      app: crm-api
  template:
    metadata:
      labels:
        app: crm-api
        release: production
    spec:
      serviceAccountName: kdvmanager-sa
      # Keep the two replicas on separate nodes. Without this every pod landed
      # on the same node, so that node's memory pressure hit both at once.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: crm-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: crm-pod
        image: ghcr.io/luuklabs/kdvmanager/crm.api:linux-main
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          # /readyz opens a TLS connection to managed Postgres, which does not
          # fit in the 1s default this probe was silently using during cold start.
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            port: 8080
            path: /healthz
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            port: 8080
            path: /readyz
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              # give the app a short chance to drain requests before SIGTERM
              command: ["/bin/sh","-c","sleep 10"]
        resources:
          # The 160Mi ceiling OOMKilled this pod 8 times (exit 137) - its steady
          # state had crept up to just under the limit. 320Mi leaves real
          # headroom; Workstation GC (below) keeps the actual footprint down.
          requests:
            cpu: 70m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 320Mi
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        env:
          - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
            value: "/tmp/dotnet_bundle_extract"
          # The Web SDK defaults to Server GC, which sizes its heaps for
          # throughput and holds far more memory than this service needs. At a
          # 300m CPU limit that trade buys nothing, so use Workstation GC.
          - name: DOTNET_gcServer
            value: "0"
          - name: OTEL__ENDPOINT # legacy key supported in code
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: OTEL_SERVICE_NAME
            value: "crm-api"
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://0.0.0.0:8080"
          - name: POSTGRES_SERVER
            value: "private-db-kdvmanager-ams3-do-user-13194146-0.l.db.ondigitalocean.com"
          - name: POSTGRES_USER
            value: "doadmin"
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kdvmanager-postgres-secret
                key: password
          - name: POSTGRES_PORT
            value: "25060"
          - name: POSTGRES_DATABASE
            value: "KDVManagerCRMDB"
          - name: ConnectionStrings__KDVManagerCRMConnectionString
            value: "Server=$(POSTGRES_SERVER); port=$(POSTGRES_PORT); database=$(POSTGRES_DATABASE); User ID=$(POSTGRES_USER); password=$(POSTGRES_PASSWORD); pooling=true; sslmode=require; Maximum Pool Size=5; Minimum Pool Size=1; Connection Idle Lifetime=300; Connection Pruning Interval=10"
          - name: RABBITMQ_DEFAULT_USER
            valueFrom:
              secretKeyRef:
                name: rabbitmq-secret
                key: RABBITMQ_DEFAULT_USER
          - name: RABBITMQ_DEFAULT_PASS
            valueFrom:
              secretKeyRef:
                name: rabbitmq-secret
                key: RABBITMQ_DEFAULT_PASS
          - name: ConnectionStrings__RabbitMQ
            value: "amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq.kdvmanager-prod.svc.cluster.local:5672/"
        volumeMounts:
        - name: dotnet-bundle-cache
          mountPath: /tmp/dotnet_bundle_extract
          readOnly: false
      initContainers:
      - name: crm-migration
        image: ghcr.io/luuklabs/kdvmanager/crm.migrator:linux-main
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        env:
          - name: POSTGRES_SERVER
            value: "private-db-kdvmanager-ams3-do-user-13194146-0.l.db.ondigitalocean.com"
          - name: POSTGRES_USER
            value: "doadmin"
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kdvmanager-postgres-secret
                key: password
          - name: POSTGRES_PORT
            value: "25060"
          - name: POSTGRES_DATABASE
            value: "KDVManagerCRMDB"
          - name: ConnectionStrings__KDVManagerCRMConnectionString
            value: "Server=$(POSTGRES_SERVER); port=$(POSTGRES_PORT); database=$(POSTGRES_DATABASE); User ID=$(POSTGRES_USER); password=$(POSTGRES_PASSWORD); pooling=true; sslmode=require; Maximum Pool Size=2; Minimum Pool Size=1; Connection Idle Lifetime=300; Connection Pruning Interval=10"
          - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
            value: "/tmp/dotnet_bundle_extract"
        volumeMounts:
          - name: dotnet-bundle-cache
            mountPath: /tmp/dotnet_bundle_extract
            readOnly: false
      # end initContainers
      volumes:
      - name: dotnet-bundle-cache
        emptyDir: {}
