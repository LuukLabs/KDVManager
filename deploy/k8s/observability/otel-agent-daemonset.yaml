apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: observability
  labels:
    app: otel-agent
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: observability-stack
    app.kubernetes.io/component: telemetry-agent
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      app: otel-agent
  template:
    metadata:
      labels:
        # Deliberately not `app: otel-collector`: that label is the gateway
        # Service's selector, and app OTLP traffic landing on this agent would
        # be refused because it runs no OTLP receiver.
        app: otel-agent
        app.kubernetes.io/name: otel-agent
        app.kubernetes.io/part-of: observability-stack
        app.kubernetes.io/component: telemetry-agent
    spec:
      serviceAccountName: otel-collector
      # Observability must survive the pressure it is meant to explain. These
      # are added by the DaemonSet controller anyway; stated here so the intent
      # is not lost. Note there is deliberately no priorityClassName - under a
      # genuine squeeze this should be evicted before the APIs are.
      tolerations:
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.155.0
          args: ["--config=/etc/otel-agent-config.yaml"]
          securityContext:
            # Kubelet writes container logs as root, and some containerd builds
            # create them mode 0640, so a non-root reader silently collects
            # nothing. The host mount below is read-only and all capabilities
            # are dropped.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: otel-agent-config
              mountPath: /etc/otel-agent-config.yaml
              subPath: otel-agent-config.yaml
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: otel-agent-config
          configMap:
            name: otel-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
